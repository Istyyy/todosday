packages:
  - apps/*
  - packages/*

# pnpm (>=10) hanya menjalankan postinstall script yang diizinkan di sini.
# Dibutuhkan oleh Prisma untuk meng-generate Prisma Client saat install.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

minimumReleaseAgeExclude:
  - "@nestjs/common@11.2.12 || 12.6.2"
  - "@nestjs/core@11.2.12 || 12.6.2"
  - "@nestjs/platform-express@11.2.12 || 12.6.2"
  - "@nestjs/testing@11.2.12 || 12.6.2"
  - "@types/react@19.3.3"
